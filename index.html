<!DOCTYPE html>
<html>

<head>
    <title>Jonathan Martin</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.1/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ─── Design tokens ─── */
        :root {
            --bg:             #FAFAF7;
            --text-primary:   #1A1A1A;
            --text-secondary: #4A4A47;
            --text-muted:     #7A7A75;
            --accent:         #D4490A;
            --border:         rgba(26, 26, 26, 0.12);
            --surface:        #F2F1EC;
            --sidebar-width:  40%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg:             #0E0E0C;
                --text-primary:   #F0EFE9;
                --text-secondary: #A8A89E;
                --text-muted:     #6A6A64;
                --accent:         #E85A1A;
                --border:         rgba(240, 239, 233, 0.12);
                --surface:        #181816;
            }
        }

        /* ─── Base reset ─── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        strong {
            font-weight: 600;
        }

        /* ─── Layout ─── */
        .site-wrapper {
            display: block;
            min-height: 100vh;
        }

        .sidebar {
            padding: 40px 28px;
        }

        .main-content {
            padding: 48px 28px;
        }

        @media (min-width: 768px) {
            .site-wrapper {
                display: grid;
                grid-template-columns: var(--sidebar-width) 1fr;
            }

            .sidebar {
                height: 100vh;
                overflow-y: auto;
                padding: 56px 48px;
                border-right: 1px solid var(--border);
            }

            .main-content {
                padding: 56px 64px;
                overflow-y: auto;
                height: 100vh;
            }
        }

        @media (min-width: 1200px) {
            .sidebar {
                padding: 72px 64px;
            }

            .main-content {
                padding: 72px 80px;
            }
        }

        /* ─── Sidebar ─── */
        .sidebar-photo {
            display: block;
            width: 100%;
            max-width: 200px;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            object-position: top center;
            border: 1px solid var(--border);
            margin-bottom: 28px;
            filter: grayscale(20%);
            transition: filter 0.4s ease;
        }

        .sidebar-photo:hover {
            filter: grayscale(0%);
        }

        .sidebar-name {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 900;
            font-size: clamp(1.75rem, 3vw, 2.25rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .sidebar-handle {
            font-family: 'Geist Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
        }

        .sidebar-tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 36px;
        }

        /* Social links */
        .social-links {
            list-style: none;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .social-links {
                flex-direction: column;
                gap: 4px;
            }
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding: 6px 0;
            transition: color 0.2s ease;
            position: relative;
        }

        .social-links a::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s ease;
        }

        .social-links a:hover {
            color: var(--accent);
        }

        .social-links a:hover::after {
            transform: scaleX(1);
        }

        .social-links i {
            width: 16px;
            font-size: 0.9rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* Contact info */
        .sidebar-contact {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .sidebar-contact a {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-family: 'Geist Mono', monospace;
            transition: color 0.2s ease;
        }

        .sidebar-contact a:hover {
            color: var(--accent);
        }

        .sidebar-contact i {
            width: 14px;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="site-wrapper">
        <aside class="sidebar">
            <img class="sidebar-photo" src="assets/me.jpeg" alt="Jonathan Martin">
            <h1 class="sidebar-name">Jonathan Martin</h1>
            <span class="sidebar-handle">// jono20201</span>
            <p class="sidebar-tagline">Father, entrepreneur and software engineering leader.</p>

            <ul class="social-links">
                <li><a href="https://github.com/Jono20201" target="_blank"><i class="fab fa-github"></i> GitHub</a></li>
                <li><a href="https://stackoverflow.com/users/1392533/jono20201" target="_blank"><i class="fab fa-stack-overflow"></i> StackOverflow</a></li>
                <li><a href="https://x.com/jono20201" target="_blank"><i class="fab fa-x-twitter"></i> X</a></li>
                <li><a href="https://www.linkedin.com/in/jonathanpaulmartin/" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a></li>
            </ul>

            <div class="sidebar-contact">
                <a href="mailto:jono20201@gmail.com"><i class="fas fa-envelope"></i> jono20201@gmail.com</a>
                <a href="tel:07446066435"><i class="fas fa-phone"></i> +44 74460 66435</a>
            </div>
        </aside>
        <main class="main-content">
            <!-- main content placeholder -->
        </main>
    </div>
</body>

</html>
