<!DOCTYPE html>
<html>

<head>
    <title>Jonathan Martin</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.1/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ─── Design tokens ─── */
        :root {
            --bg:             #FAFAF7;
            --text-primary:   #1A1A1A;
            --text-secondary: #4A4A47;
            --text-muted:     #7A7A75;
            --accent:         #D4490A;
            --border:         rgba(26, 26, 26, 0.12);
            --surface:        #F2F1EC;
            --sidebar-width:  40%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg:             #0E0E0C;
                --text-primary:   #F0EFE9;
                --text-secondary: #A8A89E;
                --text-muted:     #6A6A64;
                --accent:         #E85A1A;
                --border:         rgba(240, 239, 233, 0.12);
                --surface:        #181816;
            }
        }

        /* ─── Base reset ─── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        strong {
            font-weight: 600;
        }

        /* ─── Layout ─── */
        .site-wrapper {
            display: block;
            min-height: 100vh;
            position: relative;
        }

        .sidebar {
            padding: 40px 28px;
            background-color: var(--bg);
        }

        .main-content {
            padding: 48px 28px;
        }

        @media (min-width: 768px) {
            .site-wrapper {
                display: grid;
                grid-template-columns: var(--sidebar-width) 1fr;
                min-height: 100vh;
            }

            .sidebar {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
                padding: 56px 48px;
                border-right: 1px solid var(--border);
            }

            .main-content {
                padding: 56px 64px;
                overflow-y: auto;
                height: 100vh;
            }
        }

        @media (min-width: 1200px) {
            .sidebar {
                padding: 72px 64px;
            }

            .main-content {
                padding: 72px 80px;
            }
        }
    </style>
</head>

<body>
    <div class="site-wrapper">
        <aside class="sidebar">
            <!-- sidebar placeholder -->
        </aside>
        <main class="main-content">
            <!-- main content placeholder -->
        </main>
    </div>
</body>

</html>
